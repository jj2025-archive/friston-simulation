<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Friston-like simulator</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <h1>Hierarchical Bayesian Signal Simulation</h1>
<p>Simulates top-down (priors) and bottom-up (errors) in a 5-level hierarchy for generic body signals (e.g., fatigue). Hint: Mind should be slightly less dominant than Body. Try tweaking in realtime to avoid crashing out!</p>

<div class="controls">
    <label>MIND DOMINANCE <input type="range" id="priorBias" min="0" max="1" step="0.1" value="0.5"></label><br>
    <label>BODY DOMINANCE <input type="range" id="noiseLevel" min="0" max="1" step="0.1" value="0.5"></label><br>
    <label>UPDATE SPEED&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <input type="range" id="learningRate" min="0" max="1" step="0.1" value="0.5"></label><br>
    <button id="runBtn">Run Simulation</button>
    <button id="resetBtn">Reset</button>
</div>

<canvas id="canvas" width="600" height="400"></canvas>
    <script  src="./script.js"></script>

  </body>
  
</html>
